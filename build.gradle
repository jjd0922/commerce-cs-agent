plugins {
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id 'jacoco'
}

ext {
    junitVersion = '5.10.5'
    assertjVersion = '3.26.3'
    archUnitVersion = '1.3.0'
    mockitoVersion = '5.12.0'
    springFrameworkVersion = '6.1.14'
}

allprojects {
    group = 'com.commerce.cs'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(JacocoReport).configureEach {
        reports {
            xml.required = true
            html.required = true
            csv.required = false
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

tasks.register('jacocoRootReport', JacocoReport) {
    group = 'verification'
    description = 'Generates an aggregate JaCoCo coverage report for Codecov.'

    dependsOn subprojects.collect { it.tasks.named('test') }

    sourceDirectories.from files(subprojects.collect {
        it.sourceSets.main.allSource.srcDirs
    })
    classDirectories.from files(subprojects.collect {
        it.sourceSets.main.output
    })
    executionData.from fileTree(rootDir) {
        include '**/build/jacoco/test.exec'
    }

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
