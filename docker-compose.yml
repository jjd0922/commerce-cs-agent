services:
  mysql:
    image: mysql:8.4
    container_name: commerce-cs-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: commerce_cs
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
      MYSQL_ROOT_PASSWORD: commerce-root
      TZ: Asia/Seoul
    volumes:
      - commerce-cs-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u commerce -pcommerce --silent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  commerce-cs-mysql-data:
